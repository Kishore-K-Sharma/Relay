name: core_protocol
description: Pure-Dart wire protocol for the Relay BLE mesh. Codec, fragmentation, TTL and relay rules. No I/O.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  # Grapheme clusters, so a nickname is truncated between characters rather
  # than through one. See [Announce].
  characters: ^1.3.0
  meta: ^1.15.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
