name: transport_nostr
description: Internet relay fallback. Routes sealed frames through public relays when a peer is out of Bluetooth range.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  core_protocol: ^0.1.0
  core_crypto: ^0.1.0
  transport_api: ^0.1.0
  meta: ^1.15.0
  # secp256k1. Nostr is built on it end to end: BIP-340 Schnorr signatures for
  # every event and ECDH for NIP-44. There is no way to speak the protocol
  # without it, and no implementation of it in package:cryptography.
  bip340: ^0.2.0
  elliptic: ^0.3.11
  pointycastle: ^3.9.1
  web_socket_channel: ^3.0.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  stream_channel: ^2.1.2
