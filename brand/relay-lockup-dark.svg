<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 32 727 316" width="727" height="316" role="img" aria-label="Relay">
  <title>Relay</title>
  <defs>
    <linearGradient id="hop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FC47E"/>
      <stop offset="1" stop-color="#8BE8B4"/>
    </linearGradient>
    <mask id="node-hole">
      <rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <circle cx="50" cy="50" r="6.2" fill="#000"/>
    </mask>
  </defs>

  <rect x="0" y="32" width="727" height="316" fill="#070F0B"/>

  <g transform="translate(170 190) scale(3.0) translate(-50 -50)">
    <path d="M 22 50 Q 36 -6 50 50 Q 64 106 78 50" mask="url(#node-hole)"
          fill="none" stroke="url(#hop)" stroke-width="7.5" stroke-linecap="round"/>
    <circle cx="22" cy="50" r="8" fill="#3FC47E"/>
    <circle cx="78" cy="50" r="8" fill="#8BE8B4"/>
    <circle cx="50" cy="50" r="8" fill="none" stroke="#5FD97A" stroke-width="3.6"/>
  </g>

  <!-- Set in text rather than outlines so the file stays editable and small.
       Convert these to paths before publishing the file, so it renders
       identically on a machine without Avenir Next. -->
  <text x="340" y="228" font-family="Avenir Next, Avenir, Helvetica Neue, Helvetica, sans-serif"
        font-size="148" font-weight="600" letter-spacing="-2" fill="#F2FBF5">relay</text>
</svg>
