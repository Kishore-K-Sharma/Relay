<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Relay">
  <title>Relay</title>
  <defs>
    <linearGradient id="hop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FC47E"/>
      <stop offset="1" stop-color="#8BE8B4"/>
    </linearGradient>
    <mask id="node-hole">
      <rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <circle cx="50" cy="50" r="6.2" fill="#000"/>
    </mask>
  </defs>

  <!-- Android adaptive-icon foreground, on a transparent ground.
       Smaller than the square mark on purpose: the launcher crops this layer
       to a circle, a squircle or a teardrop as it likes, and only the middle
       66% is guaranteed to survive. At 9.0 the whole wave sits inside that,
       so no launcher shape clips a peak. -->
  <g transform="translate(512 512) scale(9.0) translate(-50 -50)">
    <path d="M 22 50 Q 36 -6 50 50 Q 64 106 78 50" mask="url(#node-hole)"
          fill="none" stroke="url(#hop)" stroke-width="7.5" stroke-linecap="round"/>
    <circle cx="22" cy="50" r="8" fill="#3FC47E"/>
    <circle cx="78" cy="50" r="8" fill="#8BE8B4"/>
    <circle cx="50" cy="50" r="8" fill="none" stroke="#5FD97A" stroke-width="3.6"/>
  </g>
</svg>
