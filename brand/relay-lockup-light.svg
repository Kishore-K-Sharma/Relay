<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 32 727 316" width="727" height="316" role="img" aria-label="Relay">
  <title>Relay</title>
  <defs>
    <linearGradient id="hop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22A05F"/>
      <stop offset="1" stop-color="#3FC47E"/>
    </linearGradient>
    <mask id="node-hole">
      <rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <circle cx="50" cy="50" r="6.2" fill="#000"/>
    </mask>
  </defs>

  <rect x="0" y="32" width="727" height="316" fill="#FFFFFF"/>

  <!-- Darker greens than the dark lockup uses. The icon palette is tuned for a
       black tile and goes weak and minty on white; this is the same mark, not
       the same hex. -->
  <g transform="translate(170 190) scale(3.0) translate(-50 -50)">
    <path d="M 22 50 Q 36 -6 50 50 Q 64 106 78 50" mask="url(#node-hole)"
          fill="none" stroke="url(#hop)" stroke-width="7.5" stroke-linecap="round"/>
    <circle cx="22" cy="50" r="8" fill="#22A05F"/>
    <circle cx="78" cy="50" r="8" fill="#3FC47E"/>
    <circle cx="50" cy="50" r="8" fill="none" stroke="#22A05F" stroke-width="3.6"/>
  </g>

  <text x="340" y="228" font-family="Avenir Next, Avenir, Helvetica Neue, Helvetica, sans-serif"
        font-size="148" font-weight="600" letter-spacing="-2" fill="#0B1410">relay</text>
</svg>
